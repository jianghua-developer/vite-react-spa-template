# ─────────────────────────────────────────────
# Vite + React SPA 前端底座 · copier 参数契约
# _envops 把 jinja 标签改为 [[ ]] / [% %] / [# #]，避开 JSX 的 {{ }}
# ─────────────────────────────────────────────
_min_copier_version: "9.0.0"

_envops:
  variable_start_string: "[["
  variable_end_string: "]]"
  block_start_string: "[%"
  block_end_string: "%]"
  comment_start_string: "[#"
  comment_end_string: "#]"

# ── 身份 ────────────────────────────────────
project_name:
  type: str
  help: 项目名（小写字母开头，仅字母/数字/连字符）
  validator: >-
    [% if not (project_name | regex_search('^[a-z][a-z0-9-]*$')) %]
    project_name 必须以小写字母开头，仅含小写字母/数字/连字符
    [% endif %]
  default: "my-app"

project_description:
  type: str
  default: ""

project_title:
  type: str
  default: ""

# ── 接入 ────────────────────────────────────
api_base_url:
  type: str
  default: "/api"

# ── 复制时排除（模板元文件/产物不进消费方）──
_exclude:
  - "copier.yml"
  - "node_modules"
  - "dist"
